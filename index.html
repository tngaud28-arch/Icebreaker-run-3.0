<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Icebreaker Run</title><link rel="stylesheet" href="css/style.css"></head><body><div id="app"><canvas id="gameCanvas"></canvas><div id="hud" class="hidden"><div class="score"><small>SCORE</small><b id="score">0</b><small>BEST <i id="best">0</i></small></div><div><button id="sound">🔊</button><button id="pause">Ⅱ</button></div></div><div id="touch" class="hidden"><button id="left">◀</button><button id="right">▶</button></div><div id="screens"><section id="menu" class="panel"><h1>ICEBREAKER <em>RUN</em></h1><p>Dodge the frozen unknown.</p><button id="play" class="primary">PLAY</button><div class="record">HIGH SCORE <b id="menuBest">0</b></div><button id="settings" class="secondary">⚙ SETTINGS</button></section><section id="paused" class="panel hidden"><h2>PAUSED</h2><button id="resume" class="primary">RESUME</button><button class="secondary home">MAIN MENU</button></section><section id="over" class="panel hidden"><h2>GAME OVER</h2><strong id="newBest" class="hidden">NEW HIGH SCORE!</strong><div class="results">SCORE <b id="finalScore">0</b> BEST <b id="finalBest">0</b></div><button id="again" class="primary">PLAY AGAIN</button><button class="secondary home">MAIN MENU</button></section><section id="settingsScreen" class="panel hidden"><h2>SETTINGS</h2><label>Sound <input id="soundSetting" type="checkbox" checked></label><label>Touch Buttons <input id="controlsSetting" type="checkbox" checked></label><label>Reduced Effects <input id="effectsSetting" type="checkbox"></label><button id="back" class="secondary">BACK</button></section></div></div><script type="module" src="js/main.js"></script></body></html>
